<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Engler — Questionnaire Responses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F7F8FB;
      --bg-soft: #F0F3F8;
      --tab: #16233B;
      --tab-deep: #0D1729;
      --ink: #16233B;
      --ink-soft: #5F6776;
      --silver: #9BA3B0;
      --silver-line: #DDE2EA;
      --accent: #2F6BFF;
      --accent-soft: #E9F0FF;
      --danger: #D64545;
      --ok: #1F9D6B;
      --shadow-sm: 0 12px 30px rgba(13, 23, 41, 0.06);
      --font-display: 'Archivo', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: linear-gradient(180deg, #FFFFFF 0%, #F8F9FC 100%);
      color: var(--ink);
      line-height: 1.5;
      min-height: 100vh;
    }
    a { color: inherit; }
    [hidden] { display: none !important; }

    header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(22,35,59,0.96);
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 24px rgba(4,10,20,0.16);
    }
    nav {
      max-width: 1240px; margin: 0 auto; padding: 16px 32px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .logo {
      font-family: var(--font-display); font-weight: 800; font-size: 1.15rem;
      letter-spacing: -0.02em; color: #FFF; text-decoration: none;
      display: flex; align-items: center; gap: 10px;
    }
    .logo .mark { width: 33px; height: 33px; border-radius: 8px; image-rendering: pixelated; }
    .logo small { font-family: var(--font-mono); font-weight: 400; font-size: 0.72rem; opacity: 0.6; letter-spacing: 0.08em; }
    .nav-right { display: flex; align-items: center; gap: 14px; color: #FFF; font-family: var(--font-mono); font-size: 0.78rem; }
    .nav-right .who { opacity: 0.7; }

    .eyebrow { font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
    h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; letter-spacing: -0.03em; line-height: 1.15; margin: 8px 0 10px; }
    h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; letter-spacing: -0.02em; }

    .btn {
      font: inherit; font-weight: 600; font-size: 0.92rem; cursor: pointer;
      padding: 12px 20px; border-radius: 999px; border: 1px solid transparent; transition: all 0.15s;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
    }
    .btn-primary { background: var(--tab); color: #FFF; }
    .btn-primary:hover { background: var(--tab-deep); }
    .btn-ghost { background: #FFF; color: var(--ink); border-color: var(--silver-line); }
    .btn-ghost:hover { border-color: var(--silver); }
    .btn-danger { background: #FFF; color: var(--danger); border-color: #F1CFCF; }
    .btn-danger:hover { border-color: var(--danger); }
    .btn-small { padding: 7px 14px; font-size: 0.8rem; }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    header .btn-ghost { background: transparent; color: #FFF; border-color: rgba(255,255,255,0.3); }
    header .btn-ghost:hover { border-color: #FFF; }

    input[type="email"], input[type="password"], input[type="search"] {
      width: 100%; font: inherit; font-size: 0.95rem; color: var(--ink);
      background: var(--bg); border: 1px solid var(--silver-line); border-radius: 10px;
      padding: 11px 14px; transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    input:focus { outline: none; background: #FFF; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    /* ---- Sign in ---- */
    .login-wrap {
      min-height: calc(100vh - 66px); display: grid; place-items: center; padding: 40px 16px;
      background: radial-gradient(circle at top right, rgba(47,107,255,0.16), transparent 35%);
    }
    .login {
      width: 100%; max-width: 400px; background: #FFF; border: 1px solid var(--silver-line);
      border-radius: 16px; box-shadow: var(--shadow-sm); padding: 32px;
    }
    .login p { color: var(--ink-soft); font-size: 0.9rem; margin-bottom: 22px; }
    .login label { display: block; font-weight: 600; font-size: 0.88rem; margin: 14px 0 6px; }
    .login .btn { width: 100%; margin-top: 22px; }
    .login-error { color: var(--danger); font-size: 0.85rem; margin-top: 12px; min-height: 1.2em; }

    /* ---- Dashboard ---- */
    .dash {
      max-width: 1240px; margin: 0 auto; padding: 28px 32px 80px;
      display: grid; grid-template-columns: 300px 1fr; gap: 32px; align-items: start;
    }
    .list-panel { position: sticky; top: 90px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 110px); }
    .list-head { display: flex; justify-content: space-between; align-items: baseline; }
    .list-head .count { font-family: var(--font-mono); font-size: 0.75rem; color: var(--silver); }
    .list { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
    .item {
      text-align: left; font: inherit; cursor: pointer; width: 100%;
      background: #FFF; border: 1px solid var(--silver-line); border-radius: 12px; padding: 12px 14px;
      transition: border-color 0.15s, background 0.15s;
    }
    .item:hover { border-color: var(--silver); }
    .item.active { border-color: var(--accent); background: var(--accent-soft); }
    .item .name { font-weight: 600; font-size: 0.95rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .date { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-soft); }
    .item .clip { float: right; font-size: 0.75rem; color: var(--silver); }
    .empty { color: var(--ink-soft); font-size: 0.9rem; padding: 24px 4px; }

    .detail { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
    .detail-head {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px;
      padding-bottom: 4px;
    }
    .detail-head .meta { font-family: var(--font-mono); font-size: 0.78rem; color: var(--silver); }
    .detail-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .placeholder {
      border: 1.5px dashed var(--silver-line); border-radius: 16px; padding: 60px 24px;
      text-align: center; color: var(--ink-soft);
    }

    section.card {
      background: #FFF; border: 1px solid var(--silver-line); border-radius: 16px;
      box-shadow: var(--shadow-sm); padding: 32px;
    }
    .card-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--silver-line); }
    .card-head .num { font-family: var(--font-mono); font-size: 0.8rem; color: var(--accent); }
    .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }
    .field:last-child { margin-bottom: 0; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
    .q { font-weight: 600; font-size: 0.95rem; }
    .hint { font-size: 0.83rem; color: var(--ink-soft); margin-top: -4px; }
    .answer {
      background: var(--bg); border: 1px solid var(--silver-line); border-radius: 10px;
      padding: 11px 14px; font-size: 0.95rem; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .answer.none { color: var(--silver); font-style: italic; }
    .sub-label { font-size: 0.8rem; color: var(--ink-soft); margin-top: 2px; }
    .answer a { color: var(--accent); }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: inline-block; padding: 8px 14px; border-radius: 999px;
      border: 1px solid var(--silver-line); background: var(--bg); font-size: 0.88rem; color: var(--silver);
    }
    .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 500; }

    .notice {
      background: var(--accent-soft); border-left: 3px solid var(--accent);
      border-radius: 10px; padding: 18px 20px; font-size: 0.95rem; margin-bottom: 18px;
    }
    .agree {
      display: flex; gap: 12px; align-items: center;
      padding: 14px 16px; border: 1px solid var(--silver-line); border-radius: 10px; background: var(--bg); font-weight: 500;
    }
    .tick {
      width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0; display: grid; place-items: center;
      border: 1.5px solid var(--silver); color: #FFF; font-size: 0.8rem;
    }
    .tick.on { background: var(--ok); border-color: var(--ok); }

    .contact { border: 1px solid var(--silver-line); border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; background: #FCFDFE; }
    .contact-title { font-family: var(--font-mono); font-size: 0.75rem; color: var(--silver); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
    .contact dl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
    .contact dt { font-size: 0.78rem; color: var(--ink-soft); }
    .contact dd { font-size: 0.95rem; overflow-wrap: anywhere; }

    .files { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .file {
      border: 1px solid var(--silver-line); border-radius: 12px; overflow: hidden; background: #FFF;
      display: flex; flex-direction: column;
    }
    .file .thumb {
      aspect-ratio: 4 / 3; display: grid; place-items: center; background:
        repeating-conic-gradient(#F0F3F8 0% 25%, #FFF 0% 50%) 50% / 16px 16px;
      color: var(--ink-soft); font-family: var(--font-mono); font-size: 0.8rem;
    }
    .file .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .file .fname { padding: 8px 10px; font-family: var(--font-mono); font-size: 0.72rem; border-top: 1px solid var(--silver-line); overflow-wrap: anywhere; }
    .file .fname a { color: var(--accent); }
    .file.failed .thumb { background: #FDF3F3; color: var(--danger); text-align: center; padding: 10px; white-space: pre-line; }
    .file.in-drive .thumb { background: var(--accent-soft); color: var(--accent); text-align: center; padding: 10px; font-weight: 500; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(120px);
      background: var(--tab-deep); color: #FFF; padding: 12px 20px; border-radius: 999px;
      font-size: 0.88rem; box-shadow: 0 12px 30px rgba(0,0,0,0.2); transition: transform 0.3s ease; z-index: 50;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 900px) {
      .dash { grid-template-columns: 1fr; }
      .list-panel { position: static; max-height: none; }
      .list { max-height: 320px; }
    }
    @media (max-width: 600px) {
      nav, .dash { padding-left: 16px; padding-right: 16px; }
      .nav-right .who { display: none; }
      section.card { padding: 22px 18px; }
      .grid-2, .contact dl { grid-template-columns: 1fr; }
    }
    @media print {
      @page { margin: 14mm; }
      header, .list-panel, .detail-actions, .toast, .login-wrap { display: none !important; }
      body { background: #FFF; min-height: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      /* Flex and grid containers don't split across pages reliably, so print
         everything as plain blocks and only keep single questions together. */
      .dash, .detail { display: block; padding: 0; max-width: none; }
      .detail-head { display: block; margin-bottom: 16px; }
      section.card { box-shadow: none; padding: 20px 22px; margin-bottom: 16px; break-inside: auto; }
      .card-head { break-after: avoid; }
      .grid-2 { display: block; }
      .field, .contact, .notice, .agree { break-inside: avoid; }
      /* Attachments print as a list of file names, without the images. */
      .files { display: block; }
      .file { display: block; border: none; border-radius: 0; }
      .file .thumb { display: none; }
      .file .fname { border: none; padding: 2px 0; font-size: 0.8rem; }
      .file .fname::before { content: '📎 '; }
      .answer { background: #FFF; }
      a { text-decoration: none; }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a class="logo" href="./"><img class="mark" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAAXNSR0IArs4c6QAAAERlWElmTU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAAACKADAAQAAAABAAAACAAAAACVhHtSAAAAp0lEQVQYGWNkQID/CCaYxQgimaCC/0Ny+xj+///PEJbUD6aB4mANLCAGSJLpKyODoU0Kw4c3r4D0FbAiRkbG/yBjgBr/wyXff/jKICjAzWDi5siwZnIR2AKQCf8V1H3/84s7/Wfl0QbTYF1AzcxAJQ1XT+5gOH7+JcO//78Z2FjYGCRlZBj2H73HcPX8TrAJIAKk4T/QgWAaZCJIDCQB9gqIAQRYvQkAXB5PkvP3l5AAAAAASUVORK5CYII=" alt="Engler logo">ENGLER <small>RESPONSES</small></a>
      <div class="nav-right" id="navRight" hidden>
        <span class="who" id="who"></span>
        <button class="btn btn-ghost btn-small" id="signOut">Sign out</button>
      </div>
    </nav>
  </header>

  <!-- Sign in -->
  <div class="login-wrap" id="loginView" hidden>
    <form class="login" id="loginForm">
      <div class="eyebrow">Team only</div>
      <h1>Questionnaire responses</h1>
      <p>Sign in with the Engler admin account to view client submissions.</p>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" required />
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required />
      <button class="btn btn-primary" type="submit" id="loginBtn">Sign in</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>

  <!-- Dashboard -->
  <div class="dash" id="dashView" hidden>
    <aside class="list-panel">
      <div class="list-head"><h2>Submissions</h2><span class="count" id="count"></span></div>
      <input type="search" id="search" placeholder="Search company or any answer…" />
      <div class="list" id="list"></div>
    </aside>
    <main class="detail" id="detail">
      <div class="placeholder">Select a submission to view it.</div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, setPersistence, browserSessionPersistence, signInWithEmailAndPassword, signOut, onAuthStateChanged }
      from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getFirestore, collection, query, orderBy, onSnapshot, doc, deleteDoc }
      from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    // Must match the config in index.html.
    const FIREBASE_CONFIG = {
      apiKey: 'AIzaSyCrmEk6X74MWQH6olX2N5Q5Zd7NJGY_SDk',
      authDomain: 'engler-questionnaire.firebaseapp.com',
      projectId: 'engler-questionnaire',
      storageBucket: 'engler-questionnaire.firebasestorage.app',
      messagingSenderId: '477147439593',
      appId: '1:477147439593:web:43ceb566517778c8fdeb78'
    };
    const SUBMISSIONS_COLLECTION = 'questionnaireSubmissions';

    const app = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db = getFirestore(app);
    setPersistence(auth, browserSessionPersistence);

    const $ = id => document.getElementById(id);
    let submissions = [];
    let selectedId = null;
    let unsubscribe = null;
    let schema = null;

    // Builds an element; text is always set via textContent because answers are
    // written by the public and must never be interpreted as HTML.
    function el(tag, attrs = {}, ...children) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === 'class') node.className = v;
        else if (k === 'text') node.textContent = v;
        else node.setAttribute(k, v);
      }
      for (const c of children) if (c != null) node.append(c);
      return node;
    }

    function toast(msg) {
      $('toast').textContent = msg;
      $('toast').classList.add('show');
      clearTimeout(toast.t);
      toast.t = setTimeout(() => $('toast').classList.remove('show'), 2600);
    }

    // ---- Question layout, read from the live questionnaire so both pages stay in sync ----
    const clean = s => s.replace(/\*/g, '').replace(/\s+/g, ' ').trim();

    function parseField(field) {
      const label = field.querySelector('label.q, .agree span');
      const hint = field.querySelector(':scope > .hint');
      const inputs = [];
      const seen = new Set();
      field.querySelectorAll('[name]').forEach(inp => {
        if (seen.has(inp.name)) return;
        seen.add(inp.name);
        const chips = inp.closest('.chips');
        inputs.push({
          name: inp.name,
          kind: chips ? 'chips' : inp.type === 'checkbox' ? 'check' : inp.tagName.toLowerCase(),
          options: chips ? [...chips.querySelectorAll('input')].map(i => i.value) : null,
          sub: inp.placeholder || inp.name
        });
      });
      let hintText = hint ? clean(hint.textContent) : '';
      let labelText = label ? label.cloneNode(true) : null;
      if (labelText) {
        labelText.querySelectorAll('.hint, .req').forEach(h => { hintText = hintText || clean(h.textContent); h.remove(); });
        labelText = clean(labelText.textContent);
      }
      return {
        type: 'field', label: labelText, hint: hintText, inputs,
        contacts: !!field.querySelector('#contacts'),
        files: !!field.querySelector('#logoFiles')
      };
    }

    function parseSchema(html) {
      const docu = new DOMParser().parseFromString(html, 'text/html');
      return [...docu.querySelectorAll('section.card')].map(sec => ({
        num: sec.querySelector('.card-head .num')?.textContent || '',
        title: clean(sec.querySelector('h2').textContent),
        blocks: [...sec.children].filter(c => !c.classList.contains('card-head')).map(c => {
          if (c.classList.contains('notice')) return { type: 'notice', text: clean(c.textContent) };
          if (c.classList.contains('grid-2')) return { type: 'grid', fields: [...c.querySelectorAll(':scope > .field')].map(parseField) };
          if (c.classList.contains('field')) return parseField(c);
          return null;
        }).filter(Boolean)
      }));
    }

    async function loadSchema() {
      if (schema) return schema;
      try {
        const res = await fetch('./index.html', { cache: 'no-cache' });
        schema = parseSchema(await res.text());
      } catch (e) {
        console.warn('Could not load questionnaire layout', e);
        schema = [];
      }
      return schema;
    }

    // ---- Rendering a submission ----
    function answerBox(value) {
      if (!value) return el('div', { class: 'answer none', text: 'No answer' });
      const box = el('div', { class: 'answer' });
      // Make plain URLs clickable without ever inserting HTML.
      String(value).split(/(https?:\/\/[^\s]+)/g).forEach((part, i) => {
        box.append(i % 2 ? el('a', { href: part, target: '_blank', rel: 'noopener noreferrer', text: part }) : part);
      });
      return box;
    }

    function renderContacts(contacts) {
      const wrap = el('div');
      const filled = (contacts || []).filter(c => Object.values(c).some(Boolean));
      if (!filled.length) return answerBox('');
      filled.forEach((c, i) => {
        const dl = el('dl');
        [['Name', c.name], ['Role', c.role], ['Email', c.email], ['Phone', c.phone]].forEach(([k, v]) => {
          const dd = el('dd');
          if (v && k === 'Email') dd.append(el('a', { href: 'mailto:' + v, text: v }));
          else if (v && k === 'Phone') dd.append(el('a', { href: 'tel:' + v, text: v }));
          else dd.textContent = v || '—';
          dl.append(el('div', {}, el('dt', { text: k }), dd));
        });
        wrap.append(el('div', { class: 'contact' }, el('div', { class: 'contact-title', text: `Contact ${i + 1}` }), dl));
      });
      return wrap;
    }

    // Files live in Google Drive (see google-drive/Code.gs). Image previews use
    // Drive's thumbnail endpoint, which works because the script shares each
    // file with "anyone with the link".
    // Errors that mean the file was never sent, so it can't be in Drive.
    const NOT_SENT = /^File (larger than|uploads are not set up)/;

    function renderFiles(files, submissionId) {
      const grid = el('div', { class: 'files' });
      (files || []).forEach(f => {
        if (!f.driveId && NOT_SENT.test(f.error || '')) {
          grid.append(el('div', { class: 'file failed' },
            el('div', { class: 'thumb', text: `Not received\n${f.error}` }),
            el('div', { class: 'fname', text: f.name })));
          return;
        }
        if (!f.driveId) {
          // The form didn't get a reply for this file, but Drive may still have
          // saved it; its folder name includes the submission ID.
          const search = `https://drive.google.com/drive/search?q=${encodeURIComponent(submissionId)}`;
          grid.append(el('div', { class: 'file in-drive', title: f.error || '' },
            el('div', { class: 'thumb', text: 'Uploaded to Drive' }),
            el('div', { class: 'fname' }, el('a', { href: search, target: '_blank', rel: 'noopener noreferrer', text: `${f.name} · Find in Drive` }))));
          return;
        }
        const id = encodeURIComponent(f.driveId);
        const url = `https://drive.google.com/file/d/${id}/view`;
        const thumb = el('div', { class: 'thumb' });
        if ((f.type || '').startsWith('image/')) {
          const img = el('img', { src: `https://drive.google.com/thumbnail?id=${id}&sz=w1000`, alt: f.name, loading: 'lazy' });
          img.onerror = () => thumb.replaceChildren('Open in Drive to view');
          thumb.append(el('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, img));
        } else {
          thumb.textContent = (f.name.split('.').pop() || 'file').toUpperCase();
        }
        grid.append(el('div', { class: 'file' }, thumb,
          el('div', { class: 'fname' }, el('a', { href: url, target: '_blank', rel: 'noopener noreferrer', text: f.name }))));
      });
      if (!grid.children.length) return el('div', { class: 'answer none', text: 'No files attached' });
      return grid;
    }

    function renderField(f, sub) {
      const box = el('div', { class: 'field' });
      if (f.inputs.some(i => i.kind === 'check')) {
        const on = f.inputs.every(i => sub.answers?.[i.name]);
        box.append(el('div', { class: 'agree' }, el('span', { class: 'tick' + (on ? ' on' : ''), text: on ? '✓' : '' }), f.label));
        return box;
      }
      if (f.label) box.append(el('div', { class: 'q', text: f.label }));
      if (f.hint) box.append(el('div', { class: 'hint', text: f.hint }));
      if (f.contacts) { box.append(renderContacts(sub.contacts)); return box; }

      f.inputs.forEach((inp, idx) => {
        const val = sub.answers?.[inp.name] || '';
        if (inp.kind === 'chips') {
          const picked = val ? val.split(', ') : [];
          const chips = el('div', { class: 'chips' });
          inp.options.forEach(o => chips.append(el('span', { class: 'chip' + (picked.includes(o) ? ' on' : ''), text: o })));
          box.append(chips);
        } else if (idx > 0) {
          if (val) box.append(el('div', { class: 'sub-label', text: inp.sub }), answerBox(val));
        } else {
          box.append(answerBox(val));
        }
      });
      if (f.files) box.append(el('div', { class: 'sub-label', text: 'Attached files' }), renderFiles(sub.files, sub.id));
      return box;
    }

    function renderFallback(sub) {
      // Used if the questionnaire layout couldn't be loaded: plain question / answer list.
      const card = el('section', { class: 'card' }, el('div', { class: 'card-head' }, el('h2', { text: 'Answers' })));
      Object.entries(sub.answers || {}).forEach(([k, v]) =>
        card.append(el('div', { class: 'field' }, el('div', { class: 'q', text: k }), answerBox(v))));
      card.append(el('div', { class: 'field' }, el('div', { class: 'q', text: 'Primary contacts' }), renderContacts(sub.contacts)));
      card.append(el('div', { class: 'field' }, el('div', { class: 'q', text: 'Attached files' }), renderFiles(sub.files, sub.id)));
      return [card];
    }

    function fmtDate(sub) {
      const d = sub.submittedAt?.toDate?.();
      return d ? d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : 'Pending…';
    }

    async function showSubmission(id) {
      selectedId = id;
      renderList();
      const sub = submissions.find(s => s.id === id);
      const detail = $('detail');
      if (!sub) { detail.replaceChildren(el('div', { class: 'placeholder', text: 'Select a submission to view it.' })); return; }
      const layout = await loadSchema();
      if (selectedId !== id) return;

      const printBtn = el('button', { class: 'btn btn-ghost btn-small', type: 'button', text: 'Print / PDF' });
      printBtn.onclick = () => printSubmission(sub);
      const txtBtn = el('button', { class: 'btn btn-ghost btn-small', type: 'button', text: 'Download .txt' });
      txtBtn.onclick = () => {
        const a = el('a', { href: URL.createObjectURL(new Blob([sub.summary || ''], { type: 'text/plain' })),
          download: `questionnaire_${(sub.companyName || 'client').replace(/[^\w-]+/g, '_')}.txt` });
        a.click();
        URL.revokeObjectURL(a.href);
      };
      const delBtn = el('button', { class: 'btn btn-danger btn-small', type: 'button', text: 'Delete' });
      delBtn.onclick = () => removeSubmission(sub, delBtn);

      const head = el('div', { class: 'detail-head' },
        el('div', {},
          el('div', { class: 'eyebrow', text: 'Submission' }),
          el('h1', { text: sub.companyName || 'Untitled' }),
          el('div', { class: 'meta', text: `${fmtDate(sub)} · ID ${sub.id}` })),
        el('div', { class: 'detail-actions' }, printBtn, txtBtn, delBtn));

      const cards = layout.length ? layout.map(sec => {
        const card = el('section', { class: 'card' },
          el('div', { class: 'card-head' }, el('span', { class: 'num', text: sec.num }), el('h2', { text: sec.title })));
        sec.blocks.forEach(b => {
          if (b.type === 'notice') card.append(el('div', { class: 'notice', text: b.text }));
          else if (b.type === 'grid') card.append(el('div', { class: 'grid-2' }, ...b.fields.map(f => renderField(f, sub))));
          else card.append(renderField(b, sub));
        });
        return card;
      }) : renderFallback(sub);

      detail.replaceChildren(head, ...cards);
      if (window.innerWidth <= 900) head.scrollIntoView({ behavior: 'smooth' });
    }

    // Prints from a hidden iframe holding a static copy of the submission.
    // Safari holds window.print() until the page finishes loading, and this
    // page never does: Firestore keeps a live connection open for onSnapshot.
    // The iframe has no such connection, so it prints straight away.
    function printSubmission(sub) {
      const title = `Questionnaire – ${sub.companyName || 'Client'}`;
      const content = $('detail').cloneNode(true);
      content.querySelectorAll('.detail-actions, img').forEach(n => n.remove());
      const styles = [...document.querySelectorAll('style, link[rel="stylesheet"]')].map(n => n.outerHTML).join('\n');

      document.querySelectorAll('iframe.print-frame').forEach(f => f.remove());
      const frame = document.createElement('iframe');
      frame.className = 'print-frame';
      frame.setAttribute('aria-hidden', 'true');
      frame.style.cssText = 'position:fixed;left:-10000px;top:0;width:900px;height:1200px;border:0;';
      frame.srcdoc = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title></title>${styles}</head><body>${content.outerHTML}</body></html>`;

      const pageTitle = document.title;
      const restore = () => {
        document.title = pageTitle;
        setTimeout(() => frame.remove(), 1000);
      };
      frame.onload = () => {
        const w = frame.contentWindow;
        // Browsers name the PDF after the page title.
        w.document.title = title;
        document.title = title;
        w.addEventListener('afterprint', restore, { once: true });
        w.focus();
        w.print();
      };
      document.body.append(frame);
    }

    async function removeSubmission(sub, btn) {
      const hasFiles = (sub.files || []).some(f => f.driveId);
      if (!confirm(`Delete the submission from "${sub.companyName}"? This can't be undone.` +
        (hasFiles ? '\n\nIts uploaded files stay in your Google Drive folder; delete those there if you no longer need them.' : ''))) return;
      btn.disabled = true;
      try {
        await deleteDoc(doc(db, SUBMISSIONS_COLLECTION, sub.id));
        selectedId = null;
        toast('Submission deleted.');
      } catch (e) {
        console.error(e);
        toast("Couldn't delete: " + (e.code || e.message));
        btn.disabled = false;
      }
    }

    // ---- List ----
    function renderList() {
      const q = $('search').value.trim().toLowerCase();
      const shown = submissions.filter(s => !q || (s.summary || s.companyName || '').toLowerCase().includes(q));
      $('count').textContent = `${shown.length}${q ? ' of ' + submissions.length : ''}`;
      const list = $('list');
      if (!shown.length) {
        list.replaceChildren(el('div', { class: 'empty', text: submissions.length ? 'No matches.' : 'No submissions yet.' }));
        return;
      }
      list.replaceChildren(...shown.map(s => {
        const n = (s.files || []).length;
        const btn = el('button', { class: 'item' + (s.id === selectedId ? ' active' : ''), type: 'button' },
          n ? el('span', { class: 'clip', text: `📎 ${n}` }) : null,
          el('span', { class: 'name', text: s.companyName || 'Untitled' }),
          el('span', { class: 'date', text: fmtDate(s) }));
        btn.onclick = () => showSubmission(s.id);
        return btn;
      }));
    }
    $('search').addEventListener('input', renderList);

    function startListening() {
      const qry = query(collection(db, SUBMISSIONS_COLLECTION), orderBy('submittedAt', 'desc'));
      unsubscribe = onSnapshot(qry, snap => {
        submissions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderList();
        if (selectedId && !submissions.some(s => s.id === selectedId)) showSubmission(null);
      }, err => {
        console.error(err);
        const msg = err.code === 'permission-denied'
          ? 'This account is not allowed to view submissions. Check the admin UID in the Firestore rules.'
          : "Couldn't load submissions: " + (err.code || err.message);
        $('list').replaceChildren(el('div', { class: 'empty', text: msg }));
      });
    }

    // ---- Auth ----
    $('loginForm').addEventListener('submit', async ev => {
      ev.preventDefault();
      $('loginError').textContent = '';
      $('loginBtn').disabled = true;
      try {
        await signInWithEmailAndPassword(auth, $('email').value.trim(), $('password').value);
        $('password').value = '';
      } catch (e) {
        $('loginError').textContent = ['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found', 'auth/invalid-email'].includes(e.code)
          ? 'Incorrect email or password.'
          : e.code === 'auth/too-many-requests' ? 'Too many attempts. Try again in a few minutes.' : 'Sign-in failed: ' + e.code;
      } finally {
        $('loginBtn').disabled = false;
      }
    });

    $('signOut').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, user => {
      $('loginView').hidden = !!user;
      $('dashView').hidden = !user;
      $('navRight').hidden = !user;
      if (unsubscribe) { unsubscribe(); unsubscribe = null; }
      if (user) {
        $('who').textContent = user.email;
        loadSchema();
        startListening();
      } else {
        submissions = [];
        selectedId = null;
        $('detail').replaceChildren(el('div', { class: 'placeholder', text: 'Select a submission to view it.' }));
        $('email').focus();
      }
    });
  </script>
</body>
</html>
